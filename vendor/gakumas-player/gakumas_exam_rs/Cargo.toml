[package]
name = "gakumas_exam_rs"
version = "0.1.0"
edition = "2021"
description = "Native backend for the gakumas_exam high-fidelity exam engine (Python reference implementation stays authoritative)"
license = "MIT"

[lib]
name = "gakumas_exam_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.27", features = ["abi3-py39"], optional = true }
serde_json = "1"
rustc-hash = "2"

[features]
default = ["python"]
python = ["dep:pyo3", "pyo3/extension-module"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
