name: security
# 依赖安全：
# - pip-audit：查已装的 Python 依赖有没有公开漏洞。推送、PR 都跑，每周再跑一次（老依赖也会新出漏洞）
# - dependency-review：PR 里新加或升级的依赖如果有已知漏洞（中危及以上），PR 检查不过
on:
  push:
  pull_request:
  schedule:
    - cron: "41 3 * * 1"

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # 查基础依赖 + dev。play / bench 里有 git 依赖和 KAA 子模块，CI 不装，不在这里查
      - name: 装依赖到独立环境
        run: |
          python -m venv env
          env/bin/pip install -U pip          # venv 自带的 pip 偏旧，本身就有已知漏洞，先升到最新
          env/bin/pip install -e ".[dev]"
      - uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266  # v1.1.0
        with:
          virtual-environment: env/

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # 把结果写成 PR 评论
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec  # v5.0.1
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
