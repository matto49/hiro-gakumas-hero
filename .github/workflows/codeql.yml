name: codeql
# 代码安全扫描：Python、桌面程序的 TS / JS、工作流本身。结果在 Security → Code scanning。
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 3 * * 1"   # 每周一扫一次：新出的查询规则也能覆盖到老代码

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # 上传扫描结果
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: none     # 三种语言都不用编译
          config: |
            paths-ignore:
              - vendor
              - tests
              - examples
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4.39.4
        with:
          category: /language:${{ matrix.language }}
