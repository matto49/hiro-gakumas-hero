# 模拟器主数据自动升级：每天看一次上游 vertesan/gakumasu-diff，有新提交就用 bump_master.py 改钉的版本，
# 带着新旧两份主数据各跑一遍测试，只要没有新增失败就开 PR（不自动合入，合不合由人定）。
# 日程依赖的表（Produce / ProduceSetting / ProduceStepOpenLesson）变了时日程不跟着升，PR 开成草稿、写明要人核对。
#
# 两份主数据各跑一遍是因为：CI 平时不下载主数据，依赖主数据的用例在 test.yml 里都跳过；
# 带着主数据跑时有几条用例本来就不过（要本机 Rust 引擎等），只比「升级后新增的失败」，不被这些挡住。
# 这里用 GITHUB_TOKEN 开的 PR 不会触发 test.yml 等别的工作流（GitHub 的限制），测试结果写在 PR 正文里。
# 仓库设置里要打开 Actions → General →「Allow GitHub Actions to create and approve pull requests」才能开 PR。
name: master-update
on:
  schedule:
    - cron: "30 3 * * *"  # UTC 03:30（北京时间 11:30）；上游多在 UTC 02:05 前后提交
  workflow_dispatch:
    inputs:
      commit:
        description: "升到上游的哪个提交（40 位；留空取最新）"
        required: false

permissions:
  contents: read

concurrency:
  group: master-update
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 看上游有没有新提交，有就改钉的版本
        id: bump
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMIT: ${{ inputs.commit }}
        run: |
          if [ -n "$COMMIT" ] && ! [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then echo "commit 要 40 位小写十六进制"; exit 1; fi
          old=$(grep -oP '^DEFAULT_COMMIT = "\K[0-9a-f]{40}' vendor/gakumas-player/scripts/fetch_master.py)
          set +e
          python vendor/gakumas-player/scripts/bump_master.py $COMMIT --summary "$RUNNER_TEMP/summary.md"
          rc=$?
          set -e
          if [ "$rc" != 0 ] && [ "$rc" != 3 ]; then exit "$rc"; fi
          new=$(grep -oP '^DEFAULT_COMMIT = "\K[0-9a-f]{40}' vendor/gakumas-player/scripts/fetch_master.py)
          if [ "$new" = "$old" ]; then echo "updated=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          branch="fix_bot_master_${new:0:7}"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "分支 $branch 已经有了（上次开过 PR），跳过"; echo "updated=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          { echo "updated=true"; echo "old=$old"; echo "new=$new"; echo "branch=$branch"
            echo "schedule_ok=$([ "$rc" = 0 ] && echo true || echo false)"; } >> "$GITHUB_OUTPUT"

      - name: 装依赖
        if: steps.bump.outputs.updated == 'true'
        run: pip install -e ".[dev]" pyyaml

      - name: 旧主数据下跑一遍测试（对照）
        if: steps.bump.outputs.updated == 'true'
        env:
          OLD: ${{ steps.bump.outputs.old }}
        run: |
          git worktree add "$RUNNER_TEMP/base" HEAD
          cd "$RUNNER_TEMP/base"
          python vendor/gakumas-player/scripts/fetch_master.py "$OLD"
          PYTHONPATH=src python -m pytest -q tests -p no:cacheprovider --junitxml="$RUNNER_TEMP/base.xml" || true

      - name: 新主数据下跑一遍测试
        if: steps.bump.outputs.updated == 'true'
        env:
          OLD: ${{ steps.bump.outputs.old }}
          NEW: ${{ steps.bump.outputs.new }}
        run: |
          # 没变的 YAML 从旧快照拷过来，fetch_master 按 Git blob 校验，只下载改了的
          mkdir -p "vendor/gakumas-player/data/master/$NEW/raw"
          cp "$RUNNER_TEMP/base/vendor/gakumas-player/data/master/$OLD/raw/"*.gz "vendor/gakumas-player/data/master/$NEW/raw/"
          python vendor/gakumas-player/scripts/fetch_master.py
          PYTHONPATH=src python -m pytest -q tests -p no:cacheprovider --junitxml="$RUNNER_TEMP/new.xml" || true

      - name: 比较两次的失败
        if: steps.bump.outputs.updated == 'true'
        env:
          SCHEDULE_OK: ${{ steps.bump.outputs.schedule_ok }}
        run: |
          python - "$RUNNER_TEMP/base.xml" "$RUNNER_TEMP/new.xml" "$RUNNER_TEMP/tests.md" <<'EOF'
          import os
          import sys
          import xml.etree.ElementTree as ET

          def result(path):
              cases = list(ET.parse(path).iter("testcase"))
              bad = {f"{c.get('classname')}::{c.get('name')}" for c in cases
                     if c.find("failure") is not None or c.find("error") is not None}
              return len(cases), bad

          (n_base, base), (n_new, new) = result(sys.argv[1]), result(sys.argv[2])
          added, fixed = sorted(new - base), sorted(base - new)
          lines = [f"- 测试：旧主数据 {n_base} 条、失败 {len(base)}；新主数据 {n_new} 条、失败 {len(new)}"]
          lines.append("- 新增失败：" + ("无" if not added else "、".join(f"`{t}`" for t in added)))
          if fixed:
              lines.append("- 升级后变成通过：" + "、".join(f"`{t}`" for t in fixed))
          open(sys.argv[3], "w", encoding="utf-8").write("\n".join(lines) + "\n")
          print("\n".join(lines))
          # 日程没跟着升时引擎会报版本不一致，新增失败是预期的：照样开草稿 PR，失败列在正文里
          sys.exit(1 if added and os.environ.get("SCHEDULE_OK") == "true" else 0)
          EOF

      - name: 开 PR
        if: steps.bump.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.bump.outputs.branch }}
          NEW: ${{ steps.bump.outputs.new }}
          SCHEDULE_OK: ${{ steps.bump.outputs.schedule_ok }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          # 只提交钉版本的几处；下载的 raw / catalog.sqlite 等在 .gitignore 里
          git add -A -- vendor/gakumas-player/scripts/fetch_master.py vendor/gakumas-player/data/master \
            vendor/gakumas-player/data/schedules docs/hajime-nia-mechanics.md
          git commit -q -m "模拟器主数据升到 gakumasu-diff ${NEW:0:7}（自动）"
          git push -q origin "$BRANCH"
          {
            cat "$RUNNER_TEMP/summary.md"
            echo
            cat "$RUNNER_TEMP/tests.md"
            echo
            echo "这个 PR 由工作流 master-update 自动开，用 GITHUB_TOKEN 开的 PR 不会触发 test 等工作流；要跑完整 CI，关掉再打开 PR 或推一个提交。"
            echo "合入后各机器跑一次 \`python vendor/gakumas-player/scripts/fetch_master.py\`（安装脚本也会跑），game.db 会自动重建。"
          } > "$RUNNER_TEMP/body.md"
          draft=""
          if [ "$SCHEDULE_OK" != true ]; then draft="--draft"; fi
          gh pr create --base main --head "$BRANCH" $draft \
            --title "模拟器主数据升到 gakumasu-diff ${NEW:0:7}" --body-file "$RUNNER_TEMP/body.md"
