# 考试引擎 Rust 后端的预编译包：main 上 vendor/gakumas-player/gakumas_exam_rs 一变就编 4 个平台的 abi3 wheel（Python ≥3.9 通用），
# 发到 Release「engine-rs-<源码哈希>」，附 manifest.json（平台键 → 文件名 + sha256）。
# scripts/setup.sh / setup.ps1 在没有 cargo 时用 scripts/engine_rs.py install 按同一个源码哈希下载。
name: engine-wheels
on:
  push:
    branches: [main]
    paths:
      - "vendor/gakumas-player/gakumas_exam_rs/**"
      - "scripts/engine_rs.py"
      - ".github/workflows/engine-wheels.yml"
  workflow_dispatch:

# 默认只读；只有发 Release 的 job 拿写权限。actions 都钉到提交 SHA（注释里是对应版本）
permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.h.outputs.tag }}
      exists: ${{ steps.h.outputs.exists }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - id: h
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="engine-rs-$(python3 scripts/engine_rs.py hash)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
          echo "源码哈希标签 $tag"

  build:
    needs: plan
    if: needs.plan.outputs.exists != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest  # macos-14 已不可用（2026-11 CI：configuration not supported）
            target: aarch64-apple-darwin
          - os: macos-latest  # Intel Mac 包在 Apple Silicon runner 上交叉编译（GitHub 已下线 Intel runner）
            target: x86_64-apple-darwin
            cross: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.10"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -m vendor/gakumas-player/gakumas_exam_rs/Cargo.toml
          manylinux: auto
      - name: 装上自检（导入、有 Exam；交叉编译的包本机跑不了，跳过）
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          python -m pip install --no-index --find-links dist gakumas_exam_rs
          python -c "import gakumas_exam_rs as m; assert hasattr(m, 'Exam'); print(m.__file__)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl

  release:
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: manifest.json + 发布
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          python3 scripts/engine_rs.py manifest dist
          gh release create "$TAG" dist/*.whl dist/manifest.json --target "$GITHUB_SHA" \
            --title "考试引擎 Rust 后端预编译包 $TAG" \
            --notes "vendor/gakumas-player/gakumas_exam_rs 源码哈希 ${TAG#engine-rs-} 的 abi3 wheel（Python ≥3.9）。scripts/setup.sh / setup.ps1 在没有 cargo 时自动下载、按 manifest.json 校验 sha256 后安装。"
