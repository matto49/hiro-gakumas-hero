# 桌面程序「初星助手」（app/，mygo 原生 ui，纯 Go，不用 Bun）的安装包：Windows 安装程序在 Ubuntu 上交叉编译（mygo 不用 cgo，NSIS 用 apt 的 makensis），
# macOS 通用版磁盘镜像在 macOS runner 上打（dmg 要 macOS）。安装包由这里的 CI 从源码构建，
# 安装包目前没有代码签名；以后拿到证书也只签这里产出的文件（见 docs/code-signing-policy.md）。
# 推 desktop-v* 标签时把安装包和 SHA256SUMS.txt 传到同名 Release；手动触发只留 Actions 产物。
name: desktop
on:
  push:
    tags: ["desktop-v*"]
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # 原生界面的测试（ui.NewTester 离屏画）和后端测试；mac 上跑，和开发环境一致
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - run: go vet ./...
      - run: go test ./...

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: windows/amd64
            uv: windows-amd64
            out: build/windows-amd64/*-setup-*.exe
            name: windows-amd64
          - os: macos-latest
            platform: darwin/universal
            uv: "darwin-arm64 darwin-amd64"
            out: build/darwin-universal/*.dmg
            name: darwin-universal
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - name: NSIS（Windows 安装程序）
        if: matrix.platform == 'windows/amd64'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nsis
      - name: 随安装包带的 uv
        run: go run ./scripts/fetchuv ${{ matrix.uv }}
      - name: 构建
        # makensis 按 locale 读安装脚本：没设 UTF-8 时读不了中文名
        env:
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8
        run: go tool mygo build -platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: desktop-${{ matrix.name }}
          path: app/${{ matrix.out }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          # 带「-」的版本号（desktop-v0.1.1-rc.1）是候选包：标预发布、不占 Latest；正式版才设成 Latest
          case "${TAG#desktop-v}" in
            *-*) flags=(--prerelease --latest=false) ;;
            *) flags=(--latest) ;;
          esac
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" "${flags[@]}" --title "初星助手 ${TAG#desktop-v}（桌面程序）" --notes "见 docs/code-signing-policy.md 和 README 的「桌面程序」一节。"
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber *
