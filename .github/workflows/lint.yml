name: lint
on:
  push:
  pull_request:
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "ruff==0.17.6"
      - name: 代码检查
        run: ruff check --output-format=github .
      - name: 格式
        run: ruff format --check .
  typecheck:
    # 只拦新增的类型错误：现有的记在 .basedpyright/baseline.json。基线是在这个环境（Python 3.10、只装 .[dev]）里生成的
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: pip install -e ".[dev]"
      - run: basedpyright
