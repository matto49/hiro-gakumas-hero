# 层与层的依赖规则（go/README.md「目录」）。go-arch-lint check 检查；新加包要在这里登记，否则报错。
version: 3
workdir: .

allow:
  depOnAnyVendor: true # 第三方库先不限；阶段 3 引入 cgo 库（gocv、onnxruntime）时再收紧到识别层
  ignoreNotFoundComponents: true # 还没建的包先登记；建好就会被检查

# 测试文件不查（测试可以把几个包接起来用）
excludeFiles:
  - "_test\\.go$"

components:
  jsonx: { in: internal/jsonx }
  home: { in: internal/home }
  clierr: { in: internal/clierr }
  proc: { in: internal/proc }
  img: { in: internal/img }
  device: { in: internal/device }
  assets: { in: internal/assets }
  master: { in: internal/master }
  golden: { in: internal/golden }
  cv: { in: internal/cv }
  ocr: { in: internal/ocr }
  onnx: { in: internal/onnx }
  pil: { in: internal/pil }
  vision: { in: internal/vision/** }
  pending: { in: internal/pending }
  store: { in: internal/store }
  pybridge: { in: internal/pybridge }
  cli: { in: internal/cli }
  info: { in: internal/info }
  catalog: { in: internal/catalog }
  plan: { in: internal/plan }
  secret: { in: internal/secret }
  report: { in: internal/report }
  service: { in: internal/service }
  run: { in: internal/run }
  doctor: { in: internal/doctor }
  parity: { in: internal/parity }
  hiro: { in: internal/hiro }
  plugin: { in: pkg/plugin }
  main: { in: cmd/** }

# 谁都能用的底层：JSON、HIRO_HOME、错误类型、子进程的平台差异
commonComponents:
  - jsonx
  - home
  - clierr
  - proc

deps:
  cli:
    mayDependOn: [pending]
  info:
    mayDependOn: [cli, store]
  catalog:
    mayDependOn: [cli]
  plan:
    mayDependOn: [cli, store, pybridge]
  secret:
    mayDependOn: [cli]
  report:
    mayDependOn: [pybridge]
  service:
    mayDependOn: [catalog, info, report, store, pybridge]
  run:
    mayDependOn: [cli, service, report, pybridge]
  device:
    mayDependOn: [img]
  cv:
    mayDependOn: [img] # 只有这里碰 gocv（cgo + OpenCV）
  ocr:
    mayDependOn: [cv, img, onnx, pil]
  master:
    mayDependOn: [assets]
  golden:
    mayDependOn: [assets, cv, img, pybridge] # 黄金数据对照：只在测试里用
  vision:
    mayDependOn: [assets, master, cv, ocr, onnx, pil, img, vision] # 判页、读数：只吃图，不碰设备、存储
  doctor:
    mayDependOn: [cli, store, secret, pybridge, device, img]
  hiro:
    mayDependOn: [cli, info, catalog, run, secret, doctor, plan]
  parity:
    anyProjectDeps: true # 对照测试：只在测试里用
  main:
    anyProjectDeps: true # 程序入口：把各命令包接到一起
